<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Meridian</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #101113;
        color: #e8e4dc;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        font-size: 13px;
        color: #9a968d;
        margin: 0;
        max-width: 28ch;
      }
      button {
        margin-top: 8px;
        background: transparent;
        color: #e8e4dc;
        border: 1px solid #2a2c30;
        border-radius: 10px;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>
      Meridian can't reach the network right now. Reconnect to sync your
      training.
    </p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
